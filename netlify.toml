[build]
  publish = "."

  # Redirections spécifiques pour les podcasts Blubrry (AVANT la règle générique)
  [[redirects]]
    from = "/api/feed/podcast"
    to = "https://artspo-livresaudio.store/index.php/feed/podcast"
    status = 200
    force = true

  [[redirects]]
    from = "/api/feed/podcast2"
    to = "https://artspo-livresaudio.store/index.php/feed/podcast2"
    status = 200
    force = true

  [[redirects]]
    from = "/api/feed/podcast3"
    to = "https://artspo-livresaudio.store/index.php/feed/podcast3"
    status = 200
    force = true

  [[redirects]]
    from = "/api/feed/podcast4"
    to = "https://artspo-livresaudio.store/index.php/feed/podcast4"
    status = 200
    force = true

  # Proxy RSS feeds to avoid CORS (règle générique pour les autres)
  [[redirects]]
    from = "/api/feed/*"
    to = "https://artspo-livresaudio.store/feed/:splat"
    status = 200
    force = true
# Proxy RSS feeds to avoid CORS
[[redirects]]
  from = "/api/feed/*"
  to = "https://artspo-livresaudio.store/feed/:splat"
  status = 200
  force = true

# Proxy audio files for offline download
[[redirects]]
  from = "/api/audio/*"
  to = "https://artspo-livresaudio.store/wp-content/uploads/:splat"
  status = 200
  force = true

# Proxy cover images
[[redirects]]
  from = "/api/images/*"
  to = "https://artspo-livresaudio.store/wp-content/uploads/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache control for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
